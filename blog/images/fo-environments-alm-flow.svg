<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Environments and release flow for Finance and Operations</title><desc id="d">Develop with Visual Studio and X++ tools, build with source control and Azure DevOps, test in a sandbox created in the Power Platform admin center, run user acceptance testing with business sign-off, then release to production in a planned, reversible way.</desc>
