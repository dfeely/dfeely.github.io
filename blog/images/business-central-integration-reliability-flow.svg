<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How a reliable Business Central integration handles success and failure</title><desc id="d">A source system sends data to an integration layer, which maps and validates it before calling Business Central. The business result is checked. Rejected transactions go to a readable error queue, trigger an alert to a named person, and are fixed and resubmitted safely without duplicates.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="360" fill="#ffffff"/>
<rect x="10" y="20" width="190" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="105.0" y="54.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Source system</text>
<text x="105.0" y="80.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">CRM, website,</text>
<text x="105.0" y="98.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">payment provider</text>
<rect x="260" y="20" width="190" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="355.0" y="54.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Integration layer</text>
<text x="355.0" y="80.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Map, validate,</text>
<text x="355.0" y="98.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">check for duplicates</text>
<rect x="510" y="20" width="190" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="605.0" y="54.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Business Central</text>
<text x="605.0" y="80.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Create or update</text>
<text x="605.0" y="98.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">through the API</text>
<rect x="760" y="20" width="190" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="855.0" y="54.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Business result</text>
<text x="855.0" y="80.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Right customer,</text>
<text x="855.0" y="98.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">dimension and price?</text>
<line x1="203" y1="70" x2="257" y2="70" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<line x1="453" y1="70" x2="507" y2="70" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<line x1="703" y1="70" x2="757" y2="70" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="755.0" y="134" width="200" height="24" rx="12" fill="#e6f4ec" stroke="#1b7f4b"/><text x="855.0" y="150.5" font-size="12.5" font-weight="600" fill="#1b7f4b" text-anchor="middle">Pass: record and reconcile</text>
<rect x="510" y="190" width="190" height="80" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="605.0" y="214.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Error queue</text>
<text x="605.0" y="240.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Readable by the</text>
<text x="605.0" y="258.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">business</text>
<rect x="260" y="190" width="190" height="80" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="355.0" y="214.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Alert</text>
<text x="355.0" y="240.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">A named person,</text>
<text x="355.0" y="258.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">before the customer</text>
<rect x="10" y="190" width="190" height="80" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="105.0" y="214.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Fix and resubmit</text>
<text x="105.0" y="240.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Safe to retry:</text>
<text x="105.0" y="258.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">no duplicates</text>
<line x1="605.0" y1="123" x2="605.0" y2="187" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<rect x="619.0" y="145" width="76" height="24" rx="12" fill="#ffffff" stroke="#b45309"/><text x="657.0" y="161.5" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">Rejected</text>
<line x1="507" y1="230" x2="453" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<line x1="257" y1="230" x2="203" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<path d="M105.0,187 L105.0,145 L355.0,145 L355.0,123" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="10" y="298" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="325.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">Idempotent calls, visible failures and scheduled reconciliation keep both systems in step.</text>
</svg>
