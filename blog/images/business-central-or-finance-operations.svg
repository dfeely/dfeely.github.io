<text x="175" y="52" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">Points to Business Central</text>
<rect x="30" y="70" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175" y="95" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Few legal entities</text>
<rect x="30" y="122" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175" y="147" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Standard finance, sales, purchasing</text>
<rect x="30" y="174" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175" y="199" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Lighter, faster implementation</text>
<rect x="30" y="226" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175" y="251" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Extend with AL and AppSource apps</text>
<rect x="620" y="20" width="330" height="270" rx="12" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="785" y="52" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">Points to Finance and Operations</text>
<rect x="640" y="70" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785" y="95" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Many entities, complex intercompany</text>
<rect x="640" y="122" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785" y="147" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Advanced supply chain or warehouse</text>
<rect x="640" y="174" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785" y="199" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">High transaction volumes</text>
<rect x="640" y="226" width="290" height="40" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785" y="251" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Extend with X++ and ISV solutions</text>
<rect x="355" y="85" width="250" height="140" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480.0" y="130.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Decide by</text>
<text x="480.0" y="156.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">process complexity,</text>
