<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Handling throttling and failures when sending orders</title><desc id="d">A queued order carrying its store order ID is sent to Finance and Operations after checking the ID has not been used. A successful create is confirmed to the store. A 429 response means wait for the Retry-After interval and retry. A business error goes to a dead-letter queue where a named owner fixes and resubmits it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="370" fill="#ffffff"/>
<rect x="10" y="80" width="180" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="100.0" y="123.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Queued order</text>
<text x="100.0" y="149.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">With store order ID</text>
<circle cx="26" cy="96" r="12" fill="#1f4e9c"/>
<text x="26" y="101" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="250" y="80" width="180" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="340.0" y="123.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Send to F&amp;O</text>
<text x="340.0" y="149.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Check ID first</text>
<circle cx="266" cy="96" r="12" fill="#1f4e9c"/>
<text x="266" y="101" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="190" y1="130" x2="250" y2="130" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="10" width="200" height="80" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="620.0" y="43.0" font-size="16" font-weight="700" fill="#1b7f4b" text-anchor="middle">Created</text>
<text x="620.0" y="69.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Confirm to the store</text>
<rect x="520" y="110" width="200" height="80" rx="10" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="620.0" y="143.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">429: slow down</text>
<text x="620.0" y="169.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Wait, then resend</text>
<rect x="520" y="210" width="200" height="80" rx="10" fill="#fdecec" stroke="#b42318" stroke-width="1.5"/>
<text x="620.0" y="243.0" font-size="16" font-weight="700" fill="#b42318" text-anchor="middle">Business error</text>
<text x="620.0" y="269.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Dead-letter queue</text>
<line x1="430" y1="110" x2="520" y2="50" stroke="#1b7f4b" stroke-width="2" marker-end="url(#a)"/>
<line x1="430" y1="130" x2="520" y2="150" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
<line x1="430" y1="150" x2="520" y2="250" stroke="#b42318" stroke-width="2" marker-end="url(#a)"/>
<rect x="780" y="210" width="170" height="80" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="865.0" y="243.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Named owner</text>
<text x="865.0" y="269.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Fix and resubmit</text>
<line x1="720" y1="250" x2="780" y2="250" stroke="#b42318" stroke-width="2" marker-end="url(#a)"/>
<rect x="10" y="316" width="940" height="44" rx="10" fill="#fdf1e3"/><text x="480.0" y="343.0" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">A retry must never create a second order. That is what the store order ID is for.</text>
</svg>
