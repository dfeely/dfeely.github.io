<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Three ways to connect an e-commerce site to Finance and Operations</title><desc id="d">Direct calls to OData or custom services suit low volume. A middleware layer of queues, Logic Apps or Functions suits most custom stores because it absorbs spikes. Dynamics 365 Commerce headless uses the Commerce Scale Unit APIs and suits omnichannel needs if Commerce is licensed.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="304" fill="#ffffff"/>
<rect x="10" y="20" width="304" height="150" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="162.0" y="79.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Direct to F&amp;O</text>
<text x="162.0" y="105.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Storefront calls OData</text>
<text x="162.0" y="123.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">or custom services</text>
<text x="162" y="200" font-size="14" font-weight="600" fill="#1f4e9c" text-anchor="middle">Good for: low volume,</text>
<text x="162" y="220" font-size="14" font-weight="600" fill="#1f4e9c" text-anchor="middle">simple B2B ordering</text>
<rect x="328" y="20" width="304" height="150" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="480.0" y="79.0" font-size="16" font-weight="700" fill="#1b7f4b" text-anchor="middle">Middleware layer</text>
<text x="480.0" y="105.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Queue, Logic Apps or</text>
<text x="480.0" y="123.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Functions in between</text>
<text x="480" y="200" font-size="14" font-weight="600" fill="#1b7f4b" text-anchor="middle">Good for: most custom</text>
<text x="480" y="220" font-size="14" font-weight="600" fill="#1b7f4b" text-anchor="middle">stores, as it absorbs spikes</text>
<rect x="646" y="20" width="304" height="150" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="798.0" y="79.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Commerce headless</text>
<text x="798.0" y="105.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Your front end on the</text>
<text x="798.0" y="123.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Commerce Scale Unit APIs</text>
<text x="798" y="200" font-size="14" font-weight="600" fill="#1f4e9c" text-anchor="middle">Good for: omnichannel,</text>
<text x="798" y="220" font-size="14" font-weight="600" fill="#1f4e9c" text-anchor="middle">if you license Commerce</text>
<rect x="10" y="250" width="940" height="44" rx="10" fill="#fdf1e3"/><text x="480.0" y="277.0" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">Whichever you pick, the storefront should never depend on F&amp;O being instantly available.</text>
</svg>
