<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 238" width="960" height="238" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The order flow from checkout to fulfilment</title><desc id="d">Seven steps: the shopper checks out and pays, the payment is authorised, the order is saved and queued, middleware validates and maps it, a sales order is created in Finance and Operations, confirmation goes back to the store, then the order is fulfilled and invoiced. The store order number travels with the order throughout.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="238" fill="#ffffff"/>
<rect x="10" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="72.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Checkout</text>
<text x="72.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Shopper pays</text>
<circle cx="26" cy="56" r="12" fill="#1f4e9c"/>
<text x="26" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<line x1="135" y1="92" x2="145" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="146" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="208.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Payment</text>
<text x="208.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Authorised</text>
<circle cx="162" cy="56" r="12" fill="#1f4e9c"/>
<text x="162" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="271" y1="92" x2="281" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="282" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="344.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Save order</text>
<text x="344.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">And queue it</text>
<circle cx="298" cy="56" r="12" fill="#1f4e9c"/>
<text x="298" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<line x1="407" y1="92" x2="417" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="418" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Validate</text>
<text x="480.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Map and check</text>
<circle cx="434" cy="56" r="12" fill="#1f4e9c"/>
<text x="434" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="543" y1="92" x2="553" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="554" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="616.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Create in F&amp;O</text>
<text x="616.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Sales order</text>
<circle cx="570" cy="56" r="12" fill="#1f4e9c"/>
<text x="570" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<line x1="679" y1="92" x2="689" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="690" y="40" width="124" height="104" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="752.0" y="85.0" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Confirm</text>
<text x="752.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Back to store</text>
<circle cx="706" cy="56" r="12" fill="#1f4e9c"/>
<text x="706" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<line x1="815" y1="92" x2="825" y2="92" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="826" y="40" width="124" height="104" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="888.0" y="85.0" font-size="14.5" font-weight="700" fill="#1b7f4b" text-anchor="middle">Fulfil</text>
<text x="888.0" y="111.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Ship, invoice</text>
<circle cx="842" cy="56" r="12" fill="#1b7f4b"/>
<text x="842" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<rect x="280.0" y="10" width="400" height="24" rx="12" fill="#ffffff" stroke="#b7c6e0"/><text x="480" y="26.5" font-size="12.5" font-weight="600" fill="#5c6670" text-anchor="middle">Store order number travels with the order all the way</text>
<rect x="10" y="176" width="940" height="44" rx="10" fill="#fdf1e3"/><text x="480.0" y="203.0" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">The order is safe in your own queue before F&amp;O is ever called.</text>
</svg>
