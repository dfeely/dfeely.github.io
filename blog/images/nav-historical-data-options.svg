<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Three ways to handle NAV historical transactions</title><desc id="d">Option 1 migrates detailed history, giving full history in one system but a more complex migration. Option 2 migrates opening balances only, which is simpler with an easier cutover but splits history between systems. Option 3 archives historical data in a separate reporting platform.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="345" fill="#ffffff"/>
<rect x="10.0" y="20" width="300" height="240" rx="12" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="160.0" y="50" font-size="13.5" font-weight="700" fill="#5c6670" text-anchor="middle">Option 1</text>
<text x="160.0" y="78" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migrate detailed history</text>
<text x="34.0" y="118" font-size="12.5" font-weight="700" fill="#1b7f4b" text-anchor="start">Advantage</text>
<text x="34.0" y="140" font-size="14" font-weight="400" fill="#212529" text-anchor="start">Full history, easier analysis,</text>
<text x="34.0" y="159" font-size="14" font-weight="400" fill="#212529" text-anchor="start">reporting in one system</text>
<text x="34.0" y="196" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">Trade-off</text>
<text x="34.0" y="218" font-size="14" font-weight="400" fill="#212529" text-anchor="start">More complex, more validation</text>
<rect x="330.0" y="20" width="300" height="240" rx="12" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480.0" y="50" font-size="13.5" font-weight="700" fill="#5c6670" text-anchor="middle">Option 2</text>
<text x="480.0" y="78" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migrate opening balances</text>
<text x="354.0" y="118" font-size="12.5" font-weight="700" fill="#1b7f4b" text-anchor="start">Advantage</text>
<text x="354.0" y="140" font-size="14" font-weight="400" fill="#212529" text-anchor="start">Simpler migration, lower</text>
<text x="354.0" y="159" font-size="14" font-weight="400" fill="#212529" text-anchor="start">data volume, easier cutover</text>
<text x="354.0" y="196" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">Trade-off</text>
<text x="354.0" y="218" font-size="14" font-weight="400" fill="#212529" text-anchor="start">History split between systems</text>
<rect x="650.0" y="20" width="300" height="240" rx="12" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="800.0" y="50" font-size="13.5" font-weight="700" fill="#5c6670" text-anchor="middle">Option 3</text>
<text x="800.0" y="78" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">Archive historical data</text>
<text x="674.0" y="118" font-size="12.5" font-weight="700" fill="#1b7f4b" text-anchor="start">Advantage</text>
<text x="674.0" y="140" font-size="14" font-weight="400" fill="#212529" text-anchor="start">History stays accessible in a</text>
<text x="674.0" y="159" font-size="14" font-weight="400" fill="#212529" text-anchor="start">separate reporting platform</text>
<text x="674.0" y="196" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">Trade-off</text>
<text x="674.0" y="218" font-size="14" font-weight="400" fill="#212529" text-anchor="start">Needs a separate platform</text>
<rect x="10" y="285" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="312.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">Choose by audit, statutory, reporting and operational requirements, not by habit.</text>
</svg>
