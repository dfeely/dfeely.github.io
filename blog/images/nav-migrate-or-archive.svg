<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 394" width="960" height="394" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Which NAV data to migrate and which to archive</title><desc id="d">Customers, vendors, items, chart of accounts, dimensions, fixed assets, bank accounts, opening balances, current transactions and active documents may need to be migrated. Old transactions, obsolete customers and vendors, historical documents and reference data may be archived. The decision depends on reporting, audit, statutory and operational requirements.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="394" fill="#ffffff"/>
<rect x="10" y="20" width="330" height="290" rx="12" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="175.0" y="54" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">May need to migrate</text>
<rect x="30" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175.0" y="95" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Customers, vendors, items</text>
<rect x="30" y="114" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175.0" y="135" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Chart of accounts, dimensions</text>
<rect x="30" y="154" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175.0" y="175" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Fixed assets, bank accounts</text>
<rect x="30" y="194" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175.0" y="215" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Opening balances</text>
<rect x="30" y="234" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="175.0" y="255" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Current transactions, active documents</text>
<rect x="620" y="20" width="330" height="290" rx="12" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="785.0" y="54" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">May be archived</text>
<rect x="640" y="74" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785.0" y="95" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Old transactions</text>
<rect x="640" y="114" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785.0" y="135" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Obsolete customers and vendors</text>
<rect x="640" y="154" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785.0" y="175" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Historical documents</text>
<rect x="640" y="194" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785.0" y="215" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Old operational records</text>
<rect x="640" y="234" width="290" height="32" rx="8" fill="#ffffff" stroke="#b7c6e0"/>
<text x="785.0" y="255" font-size="14" font-weight="600" fill="#212529" text-anchor="middle">Data kept for reference</text>
<rect x="355" y="100" width="250" height="130" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480.0" y="140.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Decide by</text>
<text x="480.0" y="166.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">reporting, audit,</text>
<text x="480.0" y="184.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">statutory and</text>
<text x="480.0" y="202.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">operational needs</text>
<line x1="352" y1="165" x2="343" y2="165" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<line x1="608" y1="165" x2="617" y2="165" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="10" y="330" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="357.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">Classify the data first: existing in NAV is not a reason to migrate it.</text>
