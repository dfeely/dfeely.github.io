<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Integration patterns for Dynamics 365 Finance and Operations</title><desc id="d">Finance and Operations sits in the centre. Ecommerce and portals connect through OData and web APIs, banks and partners through the Data Management Framework, and CRM and Power Apps through dual-write. Event-driven flows use business events and middleware such as Logic Apps and Service Bus, analytics uses Synapse Link, and security and monitoring rely on Entra ID, Key Vault and logging.</desc>
