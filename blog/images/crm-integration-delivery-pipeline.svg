<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Delivering an integration like any other software product</title><desc id="d">Source control, build, sandbox test, release with a rollback plan, then monitor with logs, alerts and a named owner.</desc>
