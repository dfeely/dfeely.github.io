<text x="285.0" y="95.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Automated CI/CD</text>
<text x="285.0" y="113.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">pipeline</text>
<circle cx="221.0" cy="46" r="12" fill="#1f4e9c"/>
<text x="221.0" y="51" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="367.0" y1="85" x2="398.0" y2="85" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
