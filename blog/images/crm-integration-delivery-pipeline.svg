<text x="480.0" y="95.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Realistic data,</text>
<text x="480.0" y="113.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">not samples</text>
<circle cx="416.0" cy="46" r="12" fill="#1f4e9c"/>
