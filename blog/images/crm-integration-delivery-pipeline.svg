<text x="675.0" y="95.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">With a clear</text>
<text x="675.0" y="113.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">rollback plan</text>
<circle cx="611.0" cy="46" r="12" fill="#1f4e9c"/>
