<title id="t">Business Central integration options at a glance</title><desc id="d">Business Central sits in the middle. CRM, ecommerce and websites, and portals and apps connect through REST or custom APIs. Microsoft 365 workflows use Power Automate, reporting and BI use OData or API queries, and a data warehouse uses ETL or Azure services.</desc>
