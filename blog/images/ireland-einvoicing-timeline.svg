<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" width="960" height="298" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Ireland's phased e-invoicing and real-time reporting timeline</title><desc id="d">November 2028: large corporates must issue e-invoices and report to Revenue in real time for domestic B2B. November 2029: all VAT-registered businesses. 1 July 2030: intra-EU B2B. Before their own phase-in date, all VAT-registered businesses must be able to receive structured e-invoices.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="298" fill="#ffffff"/>
<line x1="60" y1="70" x2="900" y2="70" stroke="#b7c6e0" stroke-width="4"/>
<circle cx="160" cy="70" r="11" fill="#1f4e9c"/>
<text x="160" y="40" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">November 2028</text>
<rect x="15" y="100" width="290" height="124" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="160" y="130" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Domestic B2B:</text>
<text x="160" y="152" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">large corporates issue</text>
<text x="160" y="174" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">e-invoices and report</text>
<text x="160" y="196" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">to Revenue in real time</text>
<circle cx="480" cy="70" r="11" fill="#1f4e9c"/>
<text x="480" y="40" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">November 2029</text>
<rect x="335" y="100" width="290" height="124" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480" y="130" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Domestic B2B:</text>
<text x="480" y="152" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">all VAT-registered</text>
<text x="480" y="174" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">businesses, whatever</text>
<text x="480" y="196" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">their size or sector</text>
<circle cx="800" cy="70" r="11" fill="#1f4e9c"/>
<text x="800" y="40" font-size="17" font-weight="700" fill="#1f4e9c" text-anchor="middle">1 July 2030</text>
<rect x="655" y="100" width="290" height="124" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="800" y="130" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Intra-EU B2B:</text>
<text x="800" y="152" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">e-invoicing and real-time</text>
<text x="800" y="174" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">reporting for cross-border</text>
<text x="800" y="196" font-size="14.5" font-weight="400" fill="#212529" text-anchor="middle">trade with EU businesses</text>
<rect x="10" y="244" width="940" height="44" rx="10" fill="#fdf1e3"/><text x="480.0" y="271.0" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">Before their own date, all VAT-registered businesses must be able to receive structured e-invoices.</text>
</svg>
