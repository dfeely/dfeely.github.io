<text x="480.0" y="110.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">A proven partner</text>
<text x="480.0" y="128.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">or marketplace app</text>
<circle cx="411.0" cy="56" r="12" fill="#1f4e9c"/>
<text x="411.0" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<line x1="567.0" y1="100" x2="585.5" y2="100" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
