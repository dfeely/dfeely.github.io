<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Fit-gap ladder for Dynamics 365 Finance and Operations</title><desc id="d">Configure standard first, then low-code, then an ISV solution, then an X++ extension. Cost, effort and upgrade risk rise at each step. Overlayering is not supported.</desc>
