<text x="95.0" y="110.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Standard setup,</text>
<text x="95.0" y="128.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">parameters, workflow</text>
<circle cx="26.0" cy="56" r="12" fill="#1f4e9c"/>
