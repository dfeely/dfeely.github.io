<text x="287.5" y="84.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Low-code</text>
<text x="287.5" y="110.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Power Platform</text>
<text x="287.5" y="128.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">and reporting tools</text>
<circle cx="218.5" cy="56" r="12" fill="#1f4e9c"/>
<text x="218.5" y="61" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="374.5" y1="100" x2="393.0" y2="100" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
