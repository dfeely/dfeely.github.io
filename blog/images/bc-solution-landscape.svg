<title id="t">The layers of a Business Central solution</title><desc id="d">Business Central, a Microsoft-managed SaaS product, combines the Microsoft W1 base app, a partner localisation for Ireland, AppSource apps, per-tenant extensions, Power Platform and APIs and integrations.</desc>
