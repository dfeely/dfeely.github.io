<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 252" width="960" height="252" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Repeated NAV to Business Central test migrations</title><desc id="d">Migration 1 is the initial data migration, migration 2 corrects mapping and transformation, migration 3 is business-user testing, migration 4 is a production rehearsal, and the final migration is the production cutover. Quality and repeatability improve with each run.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="252" fill="#ffffff"/>
<rect x="10.0" y="30" width="160" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="90.0" y="64.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migration 1</text>
<text x="90.0" y="90.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Initial data</text>
<text x="90.0" y="108.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">migration</text>
<line x1="172.0" y1="80" x2="203.0" y2="80" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="205.0" y="30" width="160" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="285.0" y="64.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migration 2</text>
<text x="285.0" y="90.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Fix mapping and</text>
<text x="285.0" y="108.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">transformation</text>
<line x1="367.0" y1="80" x2="398.0" y2="80" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="400.0" y="30" width="160" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="480.0" y="64.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migration 3</text>
<text x="480.0" y="90.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Business-user</text>
<text x="480.0" y="108.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">testing</text>
<line x1="562.0" y1="80" x2="593.0" y2="80" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="595.0" y="30" width="160" height="100" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="675.0" y="64.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Migration 4</text>
<text x="675.0" y="90.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Production</text>
<text x="675.0" y="108.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">rehearsal</text>
<line x1="757.0" y1="80" x2="788.0" y2="80" stroke="#1b7f4b" stroke-width="2" marker-end="url(#a)"/>
<rect x="790.0" y="30" width="160" height="100" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="870.0" y="64.0" font-size="16" font-weight="700" fill="#1b7f4b" text-anchor="middle">Final</text>
<text x="870.0" y="90.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Production</text>
<text x="870.0" y="108.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">cutover</text>
<path d="M20,160 L940,160" fill="none" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="295.0" y="148" width="370" height="24" rx="12" fill="#ffffff" stroke="#b7c6e0"/><text x="480" y="164.5" font-size="12.5" font-weight="600" fill="#5c6670" text-anchor="middle">Quality and repeatability improve with every run</text>
<rect x="10" y="192" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="219.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">By the final migration, the cutover should be a repeat, not a first attempt.</text>
</svg>
