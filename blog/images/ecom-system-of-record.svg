<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Who owns what between the website and Finance and Operations</title><desc id="d">The website owns content, basket and checkout, customer login and promotions. Finance and Operations owns products and costs, stock and availability, price and discount rules, and orders, invoices, tax and returns. Products, prices and stock flow to the website; orders and customers flow to F&amp;O; status, invoices and tracking flow back.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="346" fill="#ffffff"/>
<rect x="10" y="20" width="290" height="250" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="155.0" y="111.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Your website owns</text>
<text x="155.0" y="137.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Content and SEO</text>
<text x="155.0" y="155.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Basket and checkout</text>
<text x="155.0" y="173.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Customer login</text>
<text x="155.0" y="191.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Promotions and campaigns</text>
<rect x="660" y="20" width="290" height="250" rx="10" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="805.0" y="111.0" font-size="16" font-weight="700" fill="#1b7f4b" text-anchor="middle">F&amp;O owns</text>
<text x="805.0" y="137.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Products and costs</text>
<text x="805.0" y="155.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Stock and availability</text>
<text x="805.0" y="173.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Prices and discount rules</text>
<text x="805.0" y="191.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Orders, invoices, tax, returns</text>
<line x1="660" y1="90" x2="300" y2="90" stroke="#1b7f4b" stroke-width="2" marker-end="url(#a)"/>
<rect x="385.0" y="58" width="190" height="24" rx="12" fill="#e6f4ec" stroke="#1b7f4b"/><text x="480" y="74.5" font-size="12.5" font-weight="600" fill="#1b7f4b" text-anchor="middle">Products, prices, stock</text>
<line x1="300" y1="150" x2="660" y2="150" stroke="#1f4e9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="385.0" y="118" width="190" height="24" rx="12" fill="#e8eef8" stroke="#1f4e9c"/><text x="480" y="134.5" font-size="12.5" font-weight="600" fill="#1f4e9c" text-anchor="middle">Orders and customers</text>
<line x1="660" y1="215" x2="300" y2="215" stroke="#1b7f4b" stroke-width="2" marker-end="url(#a)"/>
<rect x="385.0" y="183" width="190" height="24" rx="12" fill="#e6f4ec" stroke="#1b7f4b"/><text x="480" y="199.5" font-size="12.5" font-weight="600" fill="#1b7f4b" text-anchor="middle">Status, invoices, tracking</text>
<rect x="10" y="292" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="319.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">Decide the owner of each piece of data once, and let it flow one way.</text>
</svg>
