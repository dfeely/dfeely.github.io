<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 394" width="960" height="394" role="img" aria-labelledby="t d" font-family="Muli, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Triage for NAV customisations, integrations and reports</title><desc id="d">For customisations, replace with standard functionality, redevelop as a Business Central extension, or retire. For integrations, keep, replace using Business Central APIs, or remove. For reports, use a standard Business Central report, rebuild in Jet Reports or Power BI, or retire.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/></marker></defs>
<rect width="960" height="394" fill="#ffffff"/>
<rect x="10" y="20" width="250" height="80" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="135.0" y="53.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Customisations</text>
<text x="135.0" y="79.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Does the business still need it?</text>
<rect x="300" y="30" width="200" height="60" rx="30" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="400" y="66" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Replace with standard</text>
<rect x="518" y="30" width="200" height="60" rx="30" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="618" y="66" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Redevelop as extension</text>
<rect x="736" y="30" width="200" height="60" rx="30" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="836" y="66" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Retire</text>
<rect x="10" y="120" width="250" height="80" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="135.0" y="153.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Integrations</text>
<text x="135.0" y="179.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">Can it continue?</text>
<rect x="300" y="130" width="200" height="60" rx="30" fill="#e6f4ec" stroke="#1b7f4b" stroke-width="1.5"/>
<text x="400" y="166" font-size="14.5" font-weight="700" fill="#1b7f4b" text-anchor="middle">Keep</text>
<rect x="518" y="130" width="200" height="60" rx="30" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="618" y="166" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Replace with BC APIs</text>
<rect x="736" y="130" width="200" height="60" rx="30" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="836" y="166" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Remove</text>
<rect x="10" y="220" width="250" height="80" rx="10" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="135.0" y="253.0" font-size="16" font-weight="700" fill="#1f4e9c" text-anchor="middle">Reports</text>
<text x="135.0" y="279.0" font-size="13.5" font-weight="400" fill="#212529" text-anchor="middle">What is it for?</text>
<rect x="300" y="230" width="200" height="60" rx="30" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="400" y="266" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Standard BC report</text>
<rect x="518" y="230" width="200" height="60" rx="30" fill="#e8eef8" stroke="#1f4e9c" stroke-width="1.5"/>
<text x="618" y="266" font-size="14.5" font-weight="700" fill="#1f4e9c" text-anchor="middle">Jet Reports or Power BI</text>
<rect x="736" y="230" width="200" height="60" rx="30" fill="#fdf1e3" stroke="#b45309" stroke-width="1.5"/>
<text x="836" y="266" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle">Retire</text>
<rect x="10" y="330" width="940" height="44" rx="10" fill="#e8eef8"/><text x="480.0" y="357.0" font-size="15" font-weight="600" fill="#1f4e9c" text-anchor="middle">Don't ask how to migrate each item. Ask whether the business still needs it.</text>
</svg>
